name: GSL source and ABI validation
on:
  pull_request:
    paths: ['build/native/**', 'build/followups/gsl.cake', 'Computator.NET.Core/Natives/**', '.github/workflows/native-gsl.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2025, ubuntu-24.04, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68
        with:
          global-json-file: global.json
      - name: Build source and verify native and managed ABI
        shell: pwsh
        run: ./build.ps1 -Target Native-GSL-Validate
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: gsl-${{ matrix.os }}
          path: |
            artifacts/gsl/**
            artifacts/native-build/**/probe/Testing/**
            TestResults/**
          retention-days: 7
