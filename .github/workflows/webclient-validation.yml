name: Cake web validation
on:
  pull_request:
  push:
    branches: [master]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: cake-web-${{ github.ref }}
  cancel-in-progress: true
jobs:
  production-browser-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: Computator.NET.WebClient/package-lock.json
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
      - name: Cake production frontend build, audit, publish and browser tests
        run: ./build.sh --target=Web-Validate
      - name: Web publication
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: webclient-migration-candidate
          path: artifacts/webclient/**
          retention-days: 7
      - name: Browser diagnostics
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: webclient-migration-diagnostics
          path: |
            Computator.NET.WebClient/playwright-report/**
            Computator.NET.WebClient/test-results/**
          retention-days: 7
