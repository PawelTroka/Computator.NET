name: Web client migration validation

on:
  pull_request:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: webclient-${{ github.ref }}
  cancel-in-progress: true

jobs:
  production-browser-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: Computator.NET.WebClient
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
      - name: Bootstrap reviewed dependency lock
        run: npm install
      - name: Strict TypeScript and production assets
        run: npm run build
      - name: Publish ASP.NET Core 10 host
        run: dotnet publish --configuration Release --output ../artifacts/webclient -p:SkipFrontendBuild=true
      - name: Install test browsers
        run: npx playwright install --with-deps chromium firefox
      - name: Production browser regressions
        env:
          PLAYWRIGHT_SERVER_COMMAND: cd ../artifacts/webclient && dotnet Computator.NET.WebClient.dll --urls http://127.0.0.1:4173
        run: npm test
      - name: Diagnostics and generated dependency graph
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: webclient-migration-diagnostics
          path: |
            Computator.NET.WebClient/package-lock.json
            Computator.NET.WebClient/packages.lock.json
            Computator.NET.WebClient/playwright-report/**
            Computator.NET.WebClient/test-results/**
          retention-days: 7
