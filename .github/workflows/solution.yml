name: Complete developer solution
on:
  pull_request:
  push:
    branches: [master]
permissions:
  contents: read
jobs:
  solution:
    runs-on: windows-2025
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        configuration: [Debug, Release]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73
        with:
          global-json-file: global.json
      - name: Cake validates and builds every supported project
        shell: pwsh
        run: ./build.ps1 -Target Solution-Validate -Configuration '${{ matrix.configuration }}'
