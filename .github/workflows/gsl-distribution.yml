name: GSL packaged default and managed error boundaries
on:
  pull_request:
  push:
    branches: [master]
permissions:
  contents: read
jobs:
  package:
    runs-on: windows-2025
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73
        with:
          global-json-file: global.json
      - shell: pwsh
        run: ./build.ps1 -Target GSL-Distribution-Validate
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: gsl-distribution-results
          path: |
            TestResults/**
            artifacts/gsl/**/gsl-provenance.json
          retention-days: 7
