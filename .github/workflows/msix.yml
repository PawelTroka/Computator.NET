name: MSIX desktop packaging
on:
  pull_request:
  push:
    branches: [master]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: msix-${{ github.ref }}
  cancel-in-progress: true
jobs:
  package:
    runs-on: windows-2025
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68
        with:
          global-json-file: global.json
      - name: Cake package, SDK validation and payload round-trip
        shell: pwsh
        run: ./build.ps1 -Target MSIX-Validate
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: unsigned-msix-and-validation
          path: |
            artifacts/msix/*.msix
            artifacts/msix/package-validation.json
          retention-days: 7
