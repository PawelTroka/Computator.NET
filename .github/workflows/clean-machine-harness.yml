name: Clean-machine acceptance harness (not an installation run)
on:
  pull_request:
  push:
    branches: [master]
permissions:
  contents: read
jobs:
  harness:
    runs-on: windows-2025
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68
        with:
          global-json-file: global.json
      - name: Cake validates plan safety and acceptance-result rejection cases
        shell: pwsh
        run: ./build.ps1 -Target Clean-Machine-Harness-Validate
