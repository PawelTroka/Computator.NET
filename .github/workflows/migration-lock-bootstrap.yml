# Temporary, branch-scoped lock generation. Removed after the generated graphs
# have been reviewed and the normal read-only validation uses locked restores.
name: Bootstrap migration lockfiles
on:
  push:
    branches: ['modernize/2026-compatible-toolchain']
    paths: ['.github/workflows/migration-lock-bootstrap.yml']
permissions:
  contents: read
jobs:
  lockfiles:
    if: github.repository == 'PawelTroka/Computator.NET' && github.ref == 'refs/heads/modernize/2026-compatible-toolchain'
    runs-on: windows-2025
    timeout-minutes: 15
    permissions:
      contents: write
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - name: Generate exact dependency graphs
        run: |
          dotnet restore Computator.NET.Modern.slnx -p:RestorePackagesWithLockFile=true
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Push-Location Computator.NET.WebClient
          npm install --package-lock-only --ignore-scripts
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Pop-Location
      - name: Commit only lockfiles to this migration branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          git add -- '*/packages.lock.json' 'Computator.NET.WebClient/package-lock.json'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git diff --cached --quiet
          if ($LASTEXITCODE -eq 0) { exit 0 }
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'build: lock the restored 2026 NuGet and npm dependency graphs'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $authorization = [Convert]::ToBase64String([Text.Encoding]::UTF8.GetBytes("x-access-token:$env:GH_TOKEN"))
          Write-Output "::add-mask::$authorization"
          # A normal push rejects any concurrent change; never force-update a ref.
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $authorization" push origin HEAD:refs/heads/modernize/2026-compatible-toolchain
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
