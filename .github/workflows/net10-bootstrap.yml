# Temporary, branch-only source/lockfile preparation. Remove after the generated
# diff has been reviewed. Ordinary validation has read-only permissions.
name: Prepare NET 10 migration
on:
  push:
    branches: ['modernize/net10-runtime']
    paths: ['.github/workflows/net10-bootstrap.yml']
permissions:
  contents: read
jobs:
  prepare:
    if: github.repository == 'PawelTroka/Computator.NET' && github.ref == 'refs/heads/modernize/net10-runtime'
    runs-on: windows-2025
    timeout-minutes: 15
    permissions:
      contents: write
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68
        with:
          global-json-file: global.json
      - name: Apply explicit source transformations
        run: |
          python build/net10-bootstrap.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Restore NET 10 dependency graphs
        run: |
          dotnet restore Computator.NET.sln --force-evaluate -p:RestorePackagesWithLockFile=true
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Commit source migration and lockfiles only to the experimental branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          git add -- 'Computator.NET*/**/*.cs' 'Computator.NET*/*.csproj' 'Computator.NET*/packages.lock.json'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git diff --cached --quiet
          if ($LASTEXITCODE -eq 0) { exit 0 }
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'build: apply NET 10 source migration and lock its dependency graph'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $authorization = [Convert]::ToBase64String([Text.Encoding]::UTF8.GetBytes("x-access-token:$env:GH_TOKEN"))
          Write-Output "::add-mask::$authorization"
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $authorization" push origin HEAD:refs/heads/modernize/net10-runtime
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: First runtime build
        run: |
          dotnet build Computator.NET.sln -c Release --no-restore -bl:net10.binlog
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Source and diagnostics
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: net10-source-diagnostics
          path: |
            **/*.cs
            **/*.csproj
            **/*.props
            **/packages.lock.json
            **/*.ps1
            **/*.json
            **/*.yml
            net10.binlog
            !**/bin/**
            !**/obj/**
          retention-days: 3
