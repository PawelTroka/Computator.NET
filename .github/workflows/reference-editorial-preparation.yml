name: Temporary reference editorial materialization
on:
  push:
    branches: [fix/reference-reading-layout]
    paths: [.github/workflows/reference-editorial-preparation.yml]
permissions:
  contents: write
concurrency:
  group: reference-editorial-materialization
  cancel-in-progress: false
jobs:
  prepare:
    if: github.repository == 'PawelTroka/Computator.NET' && github.ref == 'refs/heads/fix/reference-reading-layout'
    runs-on: windows-2025
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68
        with:
          global-json-file: global.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version-file: .nvmrc
      - name: Materialize the hash-bound authored source patch
        shell: python
        run: |
          import base64, hashlib, lzma, pathlib, subprocess, tempfile
          parts = ''.join(pathlib.Path(f'build/reference/editorial-part-{i}.b64').read_text(encoding='utf-8').strip() for i in range(6))
          patch = lzma.decompress(base64.b64decode(parts, validate=True))
          assert hashlib.sha256(patch).hexdigest() == '72090fbef6dde82c27a0efee5e7d56ab549b25d2c34b1c353e214aad06ba7ff5'
          paths = [line.split(' b/', 1)[1] for line in patch.decode('utf-8').splitlines() if line.startswith('diff --git ')]
          assert len(paths) == 29 and all(not name.startswith(('.git/', '.github/')) and '..' not in pathlib.PurePosixPath(name).parts for name in paths)
          print('Applying reviewed source changes:\n' + '\n'.join(paths))
          target = pathlib.Path(tempfile.gettempdir()) / 'computator-reference-editorial.patch'
          target.write_bytes(patch)
          subprocess.run(['git', 'apply', '--check', str(target)], check=True)
          subprocess.run(['git', 'apply', '--index', str(target)], check=True)
      - name: Update the existing single frontend lockfile
        shell: pwsh
        working-directory: Computator.NET.WebClient
        run: |
          npm install --package-lock-only --ignore-scripts
          if ($LASTEXITCODE -ne 0) { throw 'Lockfile update failed' }
      - name: Generate reference through the existing Cake graph
        shell: pwsh
        run: ./build.ps1 -Target Reference-Generate
      - name: Commit only authored files and generated reference payloads
        shell: pwsh
        run: |
          git add -- Computator.NET.Core/Static/functions.xml Computator.NET.Core/Static/reference-equations Computator.NET.WebClient/package-lock.json
          if ($LASTEXITCODE -ne 0) { throw 'Staging reference payloads failed' }
          git diff --cached --check
          if ($LASTEXITCODE -ne 0) { throw 'Patch whitespace check failed' }
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Typeset offline equations and extend reference explanations, examples and contextual help'
          if ($LASTEXITCODE -ne 0) { throw 'Reference commit failed' }
          git push origin HEAD:fix/reference-reading-layout
          if ($LASTEXITCODE -ne 0) { throw 'Branch advanced; no force push attempted' }
      - name: Verify actual reference examples and deterministic generation
        shell: pwsh
        run: ./build.ps1 -Target Reference-Validate
      - name: Preserve reference evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: reference-editorial-validation
          path: |
            artifacts/reference/**
            TestResults/reference*.trx
            artifacts/*.binlog
          retention-days: 7
