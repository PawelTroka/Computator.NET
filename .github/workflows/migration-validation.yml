name: NET 10 runtime validation
on:
  pull_request:
  push:
    branches: [master]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: net10-${{ github.ref }}
  cancel-in-progress: true
jobs:
  windows:
    name: NET 10 - ${{ matrix.suite }}
    runs-on: windows-2025
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        suite:
          - Computator.NET.Core.Tests
          - Computator.NET.Core.IntegrationTests
          - Computator.NET.WebApi.IntegrationTests
          - Computator.NET.Desktop.Tests
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
      - name: Locked restore, isolated profile and NET 10 regressions
        shell: pwsh
        run: ./build/Validate-Net10.ps1 -TestSuite '${{ matrix.suite }}'
      - name: Desktop NET 10 migration candidate
        if: success() && matrix.suite == 'Computator.NET.Desktop.Tests'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: desktop-net10-migration-candidate
          path: artifacts/desktop/**
          if-no-files-found: error
          retention-days: 7
      - name: Mathematical API NET 10 migration candidate
        if: success() && matrix.suite == 'Computator.NET.WebApi.IntegrationTests'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: api-net10-migration-candidate
          path: artifacts/api/**
          if-no-files-found: error
          retention-days: 7
      - name: Diagnostics
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: net10-diagnostics-${{ matrix.suite }}
          path: |
            *.binlog
            TestResults/**
            artifacts/api/*.log
          retention-days: 7
