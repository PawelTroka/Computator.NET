name: Migration validation

on:
  pull_request:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: migration-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    runs-on: windows-2025
    timeout-minutes: 30
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
      - name: Build supported desktop solution
        run: |
          dotnet build Computator.NET.Modern.slnx --configuration Release -bl:desktop.binlog -p:RestorePackagesWithLockFile=true
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Core tests
        run: |
          dotnet test Computator.NET.Core.Tests/Computator.NET.Core.Tests.csproj --configuration Release --no-build --blame-hang-timeout 120s --blame-hang-dump-type none --logger 'console;verbosity=detailed' --logger 'trx;LogFileName=core.trx' --results-directory TestResults
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Core integration tests
        run: |
          dotnet test Computator.NET.Core.IntegrationTests/Computator.NET.Core.IntegrationTests.csproj --configuration Release --no-build --blame-hang-timeout 120s --blame-hang-dump-type none --logger 'console;verbosity=detailed' --logger 'trx;LogFileName=integration.trx' --results-directory TestResults
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Diagnostics
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-migration-diagnostics
          path: |
            *.binlog
            TestResults/**
            **/packages.lock.json
          retention-days: 7
      - name: Migration source snapshot
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: migration-source-review
          path: |
            **/*.cs
            **/*.csproj
            **/*.config
            **/*.json
            **/*.xaml
            **/*.resx
            **/*.yml
            **/*.props
            **/*.targets
            **/*.cake
            **/*.ts
            **/*.tsx
            **/*.html
            **/*.cshtml
            **/*.css
            **/*.js
            **/*.sln
            **/*.slnx
            **/*.md
            **/*.manifest
            !**/obj/**
            !**/bin/**
            !**/node_modules/**
          retention-days: 1
