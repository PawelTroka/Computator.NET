name: Migration validation
on:
  pull_request:
  push:
    branches: [master]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: migration-${{ github.ref }}
  cancel-in-progress: true
jobs:
  windows:
    runs-on: windows-2025
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
      - name: Build, regressions, desktop startup and portable publication
        shell: pwsh
        run: ./build/Validate-Migration.ps1 -UpdateLocks
      - name: Desktop migration candidate
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: desktop-migration-candidate
          path: artifacts/desktop/**
          if-no-files-found: error
          retention-days: 7
      - name: Diagnostics
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-migration-diagnostics
          path: |
            *.binlog
            TestResults/**
            **/packages.lock.json
          retention-days: 7
      - name: Migration source snapshot
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: migration-source-review
          path: |
            **/*.cs
            **/*.csproj
            **/*.config
            **/*.json
            **/*.resx
            **/*.yml
            **/*.props
            **/*.targets
            **/*.ps1
            **/*.ts
            **/*.tsx
            **/*.html
            **/*.css
            **/*.js
            **/*.sln
            **/*.slnx
            **/*.md
            !**/obj/**
            !**/bin/**
            !**/node_modules/**
            !artifacts/**
          retention-days: 1
