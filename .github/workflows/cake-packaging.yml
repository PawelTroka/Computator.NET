name: Cake packaging and coverage
on:
  pull_request:
  push:
    branches: [master]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: cake-package-${{ github.ref }}
  cancel-in-progress: true
jobs:
  package:
    runs-on: windows-2025
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: Computator.NET.WebClient/package-lock.json
      - name: Cake builds and checks all three portable ZIP payloads
        shell: pwsh
        run: ./build.ps1 -Target Package
      - name: Cake collects and verifies core coverage
        shell: pwsh
        run: ./build.ps1 -Target Calculate-Coverage -CakeArguments '--suite=Computator.NET.Core.Tests'
      - name: Portable packages
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: cake-portable-packages
          path: publish/*.zip
          if-no-files-found: error
          retention-days: 7
      - name: Packaging and coverage diagnostics
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: cake-packaging-diagnostics
          path: |
            TestResults/**
            artifacts/*.binlog
            artifacts/api/*.log
          retention-days: 7
