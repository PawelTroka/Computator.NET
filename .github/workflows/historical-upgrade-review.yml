name: Historical installer review
run-name: Historical EXE acceptance with MSI handle regression
on:
  push:
    branches: [acceptance/historical-232-upgrade]
    paths: [.github/workflows/historical-upgrade-review.yml]
permissions:
  contents: read
  actions: read
concurrency:
  group: historical-review-${{ github.ref }}
  cancel-in-progress: true
jobs:
  lifecycle:
    runs-on: windows-2025
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Parse acceptance scripts with Windows PowerShell 5.1
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $bad = $false
          foreach ($path in Get-ChildItem build/acceptance -Filter '*.ps1') {
            $tokens = $null; $errors = $null
            [Management.Automation.Language.Parser]::ParseFile($path.FullName, [ref]$tokens, [ref]$errors) | Out-Null
            foreach ($diagnostic in $errors) { $bad = $true; Write-Host "$($path.Name):$($diagnostic.Extent.StartLineNumber): $($diagnostic.Message)" }
          }
          if ($bad) { throw 'Acceptance scripts failed the Windows PowerShell 5.1 parser.' }
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68
        with:
          global-json-file: global.json
      - name: Acquire the reviewed candidate bytes without rebuilding
        id: packages
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force artifacts/historical-review,artifacts/installer | Out-Null
          $root = (Resolve-Path artifacts/historical-review).Path
          $archive = Join-Path $root 'candidate.zip'
          Invoke-WebRequest 'https://api.github.com/repos/PawelTroka/Computator.NET/actions/artifacts/12014458227/zip' -Headers @{Authorization="Bearer $env:GH_TOKEN"} -OutFile $archive
          if ((Get-FileHash $archive).Hash -ne '6a9aa40b9dc34c14e1cd9c4bbeaf1d0570a6aa38cc89b9cd6d3f33bb40908e63') { throw 'Retained candidate archive digest differs.' }
          Expand-Archive $archive "$root/candidate"
          Copy-Item "$root/candidate/artifacts/installer/output" artifacts/installer/output -Recurse -Force
          @{ sourceCommit = 'd2062a33fd7af5faf3593846a589b7b5619cbf3b'; identicalMasterSourceTree = '575315952a219e4355b7f575ce0b165614ef6797'; sourceTree = '98a1027bad4f62c94c82f623eab6632cacabb354'; artifactId = 12014458227; artifactRun = 38825547427; archiveSha256 = (Get-FileHash $archive).Hash; testCommit = '${{ github.sha }}' } | ConvertTo-Json | Set-Content artifacts/historical-review/candidate-provenance.json
          ./build.ps1 -Target Installer-Historical-Fetch
      - name: Cake contracts and real COM regression tests in both PowerShell engines
        shell: pwsh
        run: ./build.ps1 -Target Clean-Machine-Harness-Validate
      - name: Cake historical EXE upgrade and failed-MSI rollback acceptance
        shell: pwsh
        env:
          COMPUTATOR_DISPOSABLE_INSTALL_TEST: '1'
        run: ./build.ps1 -Target Installer-Historical-Validate -CakeArguments '--historical-results=artifacts/installer/logs/historical'
      - name: Prepare but do not launch the offline Sandbox plan with authentic inputs
        if: always() && steps.packages.outcome == 'success'
        shell: pwsh
        run: |
          ./build.ps1 -Target Clean-Machine-Prepare -CakeArguments @('--candidate-bundle=artifacts/installer/output/Computator.NET.Installer.exe','--historical-bundle=artifacts/installer/historical/Computator.NET.Installer.v2.3.2.exe')
          Get-ChildItem artifacts/clean-machine -Recurse -Filter plan.json | ForEach-Object { Get-Content $_.FullName; Copy-Item $_.FullName artifacts/historical-review/prepared-plan.json }
      - name: Print acceptance results and failure context
        if: always()
        shell: pwsh
        run: |
          Get-ChildItem artifacts/installer/logs -Recurse -Filter acceptance.json -ErrorAction SilentlyContinue | ForEach-Object { Get-Content $_.FullName }
          Get-ChildItem artifacts/installer/logs -Recurse -Filter '*.log' -ErrorAction SilentlyContinue | ForEach-Object { Write-Host "LOG: $($_.Name)"; Get-Content $_.FullName -Tail 40 }
          git archive --format=zip --output=artifacts/historical-review/harness-source.zip HEAD build/acceptance build/followups docs/HISTORICAL-UPGRADE-ACCEPTANCE.md
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: historical-upgrade-evidence
          path: |
            artifacts/installer/logs/**
            artifacts/historical-review/*.json
            artifacts/historical-review/harness-source.zip
          retention-days: 14
