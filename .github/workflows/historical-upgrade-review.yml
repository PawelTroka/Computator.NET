name: Historical installer review
on:
  push:
    branches: [acceptance/historical-232-upgrade]
    paths: [.github/workflows/historical-upgrade-review.yml]
permissions:
  contents: read
  actions: read
jobs:
  lifecycle:
    runs-on: windows-2025
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68
        with:
          global-json-file: global.json
      - name: Parse acceptance scripts with Windows PowerShell 5.1
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          foreach ($path in Get-ChildItem build/acceptance -Filter '*.ps1') {
            $tokens = $null; $errors = $null
            [Management.Automation.Language.Parser]::ParseFile($path.FullName, [ref]$tokens, [ref]$errors) | Out-Null
            if ($errors.Count) { throw ($errors | Out-String) }
          }
      - name: Acquire the reviewed candidate bytes, without rebuilding or accepting tool terms
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force artifacts/historical-review | Out-Null
          $root = (Resolve-Path artifacts/historical-review).Path
          $archive = Join-Path $root 'candidate.zip'
          Invoke-WebRequest 'https://api.github.com/repos/PawelTroka/Computator.NET/actions/artifacts/12014458227/zip' -Headers @{Authorization="Bearer $env:GH_TOKEN"} -OutFile $archive
          if ((Get-FileHash $archive).Hash -ne '6a9aa40b9dc34c14e1cd9c4bbeaf1d0570a6aa38cc89b9cd6d3f33bb40908e63') { throw 'Retained candidate archive digest differs from GitHub metadata.' }
          Expand-Archive $archive "$root/candidate"
          Copy-Item "$root/candidate/artifacts/installer/output" artifacts/installer/output -Recurse -Force
          $provenance = @{ sourceCommit = 'd2062a33fd7af5faf3593846a589b7b5619cbf3b'; identicalMasterSourceTree = '575315952a219e4355b7f575ce0b165614ef6797'; artifactId = 12014458227; artifactRun = 38825547427; archiveSha256 = (Get-FileHash $archive).Hash; testCommit = '${{ github.sha }}' }
          $provenance | ConvertTo-Json | Set-Content artifacts/historical-review/candidate-provenance.json
          ./build.ps1 -Target Installer-Historical-Fetch
      - name: Cake historical EXE upgrade and failed-MSI rollback acceptance
        shell: pwsh
        env:
          COMPUTATOR_DISPOSABLE_INSTALL_TEST: '1'
        run: |
          if ($env:RUNNER_ENVIRONMENT -ne 'github-hosted') { throw 'Only a disposable GitHub-hosted runner is authorized.' }
          ./build.ps1 -Target Installer-Historical-Validate -CakeArguments '--historical-results=artifacts/installer/logs/historical'
      - name: Print acceptance results and failure context
        if: always()
        shell: pwsh
        run: |
          Get-ChildItem artifacts/installer/logs -Recurse -Filter acceptance.json -ErrorAction SilentlyContinue | ForEach-Object { Get-Content $_.FullName }
          Get-ChildItem artifacts/installer/logs -Recurse -Filter '*.log' -ErrorAction SilentlyContinue | ForEach-Object { Write-Host "LOG: $($_.Name)"; Get-Content $_.FullName -Tail 25 }
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: historical-upgrade-evidence
          path: |
            artifacts/installer/logs/**
            artifacts/historical-review/candidate-provenance.json
          retention-days: 14
