name: Precompiled builtins correctness and historical latency
on:
  pull_request:
    paths:
      - 'Computator.NET.Core/Evaluation/ExpressionsEvaluator.cs'
      - 'Computator.NET.Core/Compilation/BuiltinFacadePolicy.cs'
      - 'Computator.NET.Core.Tests/PrecompiledBuiltin*.cs'
      - 'build/PrecompiledTslBuiltins.targets'
      - '.github/workflows/precompiled-builtins.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  comparison:
    runs-on: windows-2025
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68
        with:
          global-json-file: global.json
      - name: Differential correctness, native ABI, source fidelity and collectible lifetime
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path artifacts/builtin-tests -Force | Out-Null
          dotnet test Computator.NET.Core.Tests/Computator.NET.Core.Tests.csproj -c Release --filter FullyQualifiedName~PrecompiledBuiltin --logger 'trx;LogFileName=builtins.trx' --results-directory artifacts/builtin-tests 2>&1 | Tee-Object -FilePath artifacts/builtin-tests/build-and-test.log
          if ($LASTEXITCODE -ne 0) { throw 'Builtin correctness failed; do not benchmark a failing product.' }
          [xml]$trx = Get-Content artifacts/builtin-tests/builtins.trx -Raw
          $counts = $trx.TestRun.ResultSummary.Counters
          if ([int]$counts.executed -lt 30 -or [int]$counts.failed -ne 0 -or [int]$counts.executed -ne [int]$counts.passed) { throw 'Focused test completeness failed.' }
      - name: Prepare the authentic historical binary and candidate
        shell: pwsh
        run: ./build/performance/Prepare-Comparison.ps1 -OutputDirectory artifacts/builtin-input -DisposableProfile
      - name: Single-pair protocol and workload screening
        shell: pwsh
        run: |
          python build/performance/compare.py run --manifest artifacts/builtin-input/manifest.json --output artifacts/builtin-screening --pairs 1 --timeout 120 --bootstrap 50000 --seed 191
          if ($LASTEXITCODE -ne 0) { throw 'A workload or observation is invalid; preserve it and stop.' }
      - name: Twenty same-machine historical/candidate pairs
        shell: pwsh
        run: |
          python build/performance/compare.py run --manifest artifacts/builtin-input/manifest.json --output artifacts/builtin-results --pairs 20 --timeout 120 --bootstrap 50000 --seed 191
          if ($LASTEXITCODE -ne 0) { throw 'The comparison is invalid. Inspect retained observations.' }
      - name: Publish observed measurements
        if: always()
        shell: pwsh
        run: |
          if (Test-Path artifacts/builtin-results/report.md) {
            Get-Content artifacts/builtin-results/report.md
            Get-Content artifacts/builtin-results/report.md | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append
          }
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: precompiled-builtins-evidence
          if-no-files-found: error
          retention-days: 30
          path: |
            artifacts/builtin-tests/
            artifacts/builtin-input/manifest.json
            artifacts/builtin-input/windows-environment.json
            artifacts/builtin-input/historical/baseline-provenance.json
            artifacts/builtin-input/*conditioning*
            artifacts/builtin-screening/
            artifacts/builtin-results/
