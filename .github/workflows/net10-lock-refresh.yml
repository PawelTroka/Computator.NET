# One-time dependency-graph generation for this trusted migration branch only.
# Removed after review; ordinary PR validation remains read-only and locked.
name: NET 10 lock refresh
on:
  push:
    branches: ['modernize/net10-runtime']
    paths: ['.github/workflows/net10-lock-refresh.yml']
permissions:
  contents: read
jobs:
  refresh:
    if: github.repository == 'PawelTroka/Computator.NET' && github.ref == 'refs/heads/modernize/net10-runtime'
    runs-on: windows-2025
    timeout-minutes: 10
    permissions:
      contents: write
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68
        with:
          global-json-file: global.json
      - name: Restore the updated API dependency graph
        run: |
          dotnet restore Computator.NET.sln
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Commit only generated API lockfiles
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          git add -- Computator.NET.WebApi/packages.lock.json Computator.NET.WebApi.IntegrationTests/packages.lock.json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git diff --cached --quiet
          if ($LASTEXITCODE -eq 0) { exit 0 }
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'build: lock Swagger 10.3 and Newtonsoft 13.0.4 for the NET 10 API'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $authorization = [Convert]::ToBase64String([Text.Encoding]::UTF8.GetBytes("x-access-token:$env:GH_TOKEN"))
          Write-Output "::add-mask::$authorization"
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $authorization" push origin HEAD:refs/heads/modernize/net10-runtime
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
