# Temporary trusted-branch editorial correction and materialization. Removed
# after reviewing its exact three-file output; not a production build mutation.
name: Finalize tested beta reference correction
on:
  push:
    branches: ['content/complete-function-constant-reference']
    paths: ['.github/workflows/reference-finalize.yml']
permissions:
  contents: read
jobs:
  materialize:
    if: github.repository == 'PawelTroka/Computator.NET' && github.ref == 'refs/heads/content/complete-function-constant-reference'
    runs-on: windows-2025
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68
        with:
          global-json-file: global.json
      - name: Apply the independently reproduced parameter-order correction to prose only
        shell: python
        run: |
          from pathlib import Path
          path=Path('build/reference/special.py')
          text=path.read_text(encoding='utf-8')
          replacements={
            "return A('Unregularized incomplete beta','The beta integral accumulated up to x.',": "return A('Incomplete beta — legacy parameter-order caveat','The intended quantity is the lower beta integral accumulated up to x; the current wrapper passes its arguments in a different order.',",
            "'Bₓ(a,b)=∫₀ˣ t^(a−1)(1−t)^(b−1)dt', '0≤x≤1, a>0, b>0; argument order is x,a,b.',": "'Intended: Bₓ(a,b)=∫₀ˣ t^(a−1)(1−t)^(b−1)dt. Current forwarding: B_b(x,a).', 'The visible signature is x,a,b and checks 0≤x≤1, a,b>0, but Meta.Numerics expects a,b,x. The effective integration limit is b, so b>1 can be rejected by the library.',",
            "alias+'Divide by Beta(a,b) to obtain the regularized Iₓ(a,b).','Beta(0.5,1,1) = 0.5',DLMF+'8.17')": "alias+'The wrapper and its β alias call Meta.Numerics.Functions.AdvancedMath.Beta(x,a,b), not Beta(a,b,x). Beta(0.5,1,1) = 2, not the intended 0.5. For Bₓ(a,b), use MathNet.Numerics.SpecialFunctions.BetaIncomplete(a,b,x). This content change does not alter calculations.','MathNet.Numerics.SpecialFunctions.BetaIncomplete(1,1,0.5) = 0.5',MATHNET+'MathNet.Numerics/SpecialFunctions.htm')",
            "Until the numerical wrapper is corrected, use Beta(x,a,b)/Beta(a,b) for that intended value.": "For the intended value use MathNet.Numerics.SpecialFunctions.BetaRegularized(a,b,x); the three-argument Beta wrapper also has an ordering defect, so Beta(x,a,b)/Beta(a,b) is not a reliable workaround."
          }
          for old,new in replacements.items():
            if text.count(old)!=1: raise SystemExit('Expected exactly one editorial match: '+old)
            text=text.replace(old,new)
          path.write_text(text,encoding='utf-8',newline='\n')
          path=Path('docs/FUNCTION-REFERENCE.md');text=path.read_text(encoding='utf-8')
          old='| `BetaNorm(x,a,b)` | The native forwarding uses the wrong parameter order for the advertised normalized beta; the article gives the intended definition, actual forwarding and a usable alternative. |'
          new='| `Beta(x,a,b)`, `β(x,a,b)`, `BetaNorm(x,a,b)` | Both incomplete-beta wrappers forward the wrong parameter order. An independent example test reproduced Beta(0.5,1,1)=2 instead of 0.5. The help distinguishes actual/intended results and gives the tested Math.NET BetaIncomplete/BetaRegularized alternatives; dividing the broken three-argument wrapper by complete beta is not a fix. |'
          if text.count(old)!=1:raise SystemExit('Expected beta review entry.')
          path.write_text(text.replace(old,new),encoding='utf-8',newline='\n')
      - name: Regenerate reference through Cake
        shell: pwsh
        run: ./build.ps1 -Target Reference-Generate
      - name: Commit only reviewed authoring, its materialized XML and explanation
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          git add -- build/reference/special.py docs/FUNCTION-REFERENCE.md Computator.NET.Core/Static/functions.xml
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'docs: correct both incomplete-beta references using reproduced parameter-order evidence'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $authorization = [Convert]::ToBase64String([Text.Encoding]::UTF8.GetBytes("x-access-token:$env:GH_TOKEN"))
          Write-Output "::add-mask::$authorization"
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $authorization" push origin HEAD:refs/heads/content/complete-function-constant-reference
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Exact editorial review output
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: final-reference-materialization
          path: |
            artifacts/reference/**
            build/reference/*.py
            Computator.NET.Core/Static/functions.xml
            TestResults/reference*.trx
          retention-days: 7
