# Temporary read-only content inventory. Removed when the reviewed reference and
# permanent coverage gates are committed; no generated source is pushed by CI.
name: Function reference inventory
on:
  pull_request:
permissions:
  contents: read
jobs:
  inventory:
    runs-on: windows-2025
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68
        with:
          global-json-file: global.json
      - name: Cake runtime inventory
        shell: pwsh
        run: ./build.ps1 -Target UnitTests
      - name: Reference-review inputs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: function-reference-review-inputs
          path: |
            **/function-reference-inventory.json
            Computator.NET.Core/**/*.cs
            Computator.NET.Core/Static/functions.xml
            Computator.NET.Core.Tests/AutocompletionTests/**
            Computator.NET.Core.IntegrationTests/Data/**
            Computator.NET.Engine/**/*.cs
            Computator.NET.Desktop/Controls/AutocompleteMenu/*.cs
            Computator.NET.WebApi/Controllers/AutocompleteController.cs
            Computator.NET.WebClient/ClientApp/helpers/CustomCompleter.tsx
            build.cake
            build/**/*.cake
            Computator.NET.slnx
            Directory.Packages.props
            !**/obj/**
            !**/bin/**
          retention-days: 2
