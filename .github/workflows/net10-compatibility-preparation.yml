# Temporary preparation only on the experimental branch; remove after review.
name: Prepare NET 10 designer metadata
on:
  push:
    branches: ['modernize/net10-runtime']
    paths: ['.github/workflows/net10-compatibility-preparation.yml', 'build/Prepare-Net10-Compatibility.py']
permissions:
  contents: read
jobs:
  prepare:
    if: github.repository == 'PawelTroka/Computator.NET' && github.ref == 'refs/heads/modernize/net10-runtime'
    runs-on: windows-2025
    timeout-minutes: 25
    permissions:
      contents: write
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68
        with:
          global-json-file: global.json
      - name: Explicit property serialization metadata
        run: |
          dotnet restore Computator.NET.sln --locked-mode
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python build/Prepare-Net10-Compatibility.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Commit reviewed metadata on the experimental branch only
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          git add -u
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git diff --cached --quiet
          if ($LASTEXITCODE -eq 0) { exit 0 }
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix: explicitly declare designer serialization and Windows runtime metadata'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $authorization = [Convert]::ToBase64String([Text.Encoding]::UTF8.GetBytes("x-access-token:$env:GH_TOKEN"))
          Write-Output "::add-mask::$authorization"
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $authorization" push origin HEAD:refs/heads/modernize/net10-runtime
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Actual NET 10 runtime validation
        run: |
          ./build/Validate-Net10.ps1 -TestSuite All *> net10-validation.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Source and diagnostics for review
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: net10-designer-results
          path: |
            net10*.log
            TestResults/**
            **/*.cs
            **/*.csproj
            **/*.props
            **/packages.lock.json
            !**/bin/**
            !**/obj/**
            !artifacts/**
          retention-days: 3
