name: Temporary reference example acceptance
on:
  push:
    branches: [fix/reference-reading-layout]
    paths: [.github/workflows/reference-editorial-recheck.yml]
permissions:
  contents: write
concurrency:
  group: reference-editorial-materialization
  cancel-in-progress: false
jobs:
  verify:
    if: github.repository == 'PawelTroka/Computator.NET' && github.ref == 'refs/heads/fix/reference-reading-layout'
    runs-on: windows-2025
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68
        with:
          global-json-file: global.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version-file: .nvmrc
      - name: Correct demonstrated example mismatches without changing numerical behavior
        shell: python
        run: |
          from pathlib import Path
          import subprocess
          changed=[]
          def replace(path, old, new):
              file=Path(path); text=file.read_text(encoding='utf-8')
              assert text.count(old)==1, (path, old)
              file.write_text(text.replace(old,new),encoding='utf-8',newline='\n')
              if path not in changed: changed.append(path)
          replace('build/reference/enrichment.py', "'Beta.PDF(2,2,0.5)'", "'MathNet.Numerics.Distributions.Beta.PDF(2,2,0.5)'")
          replace('build/reference/enrichment.py',
              'The symmetric density peaks above one. Its area, not its peak height, is the probability.',
              'The symmetric density peaks above one. Its area, not its peak height, is the probability. The qualified class name avoids the scalar Beta function name collision in TSL.')
          replace('build/reference/distributions.py',
              'do not confuse the Beta class with the scalar Beta special function.',
              'the short Beta class name collides with the scalar Beta special function in generated TSL. Use MathNet.Numerics.Distributions.Beta.PDF(a,b,x), or the corresponding fully qualified member, to avoid that collision.')
          replace('build/reference/distributions.py', 'Beta.PDF(1,1,0.5) = 1:', 'MathNet.Numerics.Distributions.Beta.PDF(1,1,0.5) = 1:')
          replace('build/reference/enrichment_more.py',
              'The global minimum is at the origin; evaluating the function does not search for it.',
              'The displayed standard form has its minimum zero at the origin. The pinned Math.NET implementation omits the final +0.7 and returns -0.7 there instead. This vertical shift changes objective values, not the minimizing coordinates; evaluating the function does not search for them.')
          replace('build/reference/enrichment_more.py',
              "('Bohachevsky1(0,0)','approximately 0','The two cosine offsets cancel the final constant.')",
              "('Bohachevsky1(0,0)+0.7','approximately 0','The current implementation returns -0.7 at the origin. Adding the omitted constant recovers the standard benchmark value zero; this is an explicit normalization correction, not the raw function result.')")
          replace('build/reference/special.py', 'Real x,y; global minimum 0 at (0,0).',
              'Real x,y. The displayed standard form has minimum 0 at (0,0), but the pinned implementation omits +0.7 and has value -0.7 at that same minimizer. Add 0.7 explicitly when comparing with the standard benchmark.')
          replace('build/reference/special.py',
              "return A(title,definition,formula,domain,'This evaluates a benchmark surface; it does not run an optimizer.',url=MATHNET+'MathNet.Numerics/TestFunctions.htm',category='Optimization benchmarks')",
              "return A(title,definition,formula,domain,'This evaluates a benchmark surface; it does not run an optimizer.',url=('https://github.com/mathnet/mathnet-numerics/blob/v5.0.0/src/Numerics/SpecialFunctions/TestFunctions.cs' if name=='Bohachevsky1' else MATHNET+'MathNet.Numerics/TestFunctions.htm'),category='Optimization benchmarks')")
          replace('Computator.NET.WebClient/custom-functions-e2e/function-reference.spec.ts',
              "await expect(tooltip.locator('.reference-signature code')).toContainText('Ai(real x)');",
              "await expect(page.locator('.ace_autocomplete')).toContainText('Ai(real x)');\n  await expect(tooltip.locator('.reference-signature code')).toHaveCount(0);")
          replace('Computator.NET.WebClient/tests/reference-equations.spec.ts',
              'const [id, asset] = Object.entries(manifest.equations)[0] as [string, { width: number; height: number }];',
              "const equations = manifest.equations as Record<string, { tex: string; width: number; height: number }>;\nconst gamma = Object.entries(equations).find(([, equation]) => equation.tex.includes('Gamma(z)'));\nif (!gamma) throw new Error('The shipped gamma integral is missing');\nconst [id, asset] = gamma;")
          test=Path('Computator.NET.Core.Tests/AutocompletionTests/FunctionReferenceCompatibilityExampleTests.cs')
          assert not test.exists()
          test.write_text('''using System;
          using Computator.NET.Core.Autocompletion.DataSource;
          using Computator.NET.Core.Compilation;
          using Computator.NET.Core.Evaluation;
          using Computator.NET.Core.Functions;
          using Computator.NET.Core.Natives;
          using Computator.NET.DataTypes;
          using NUnit.Framework;

          namespace Computator.NET.Core.Tests.AutocompletionTests
          {
              [TestFixture, NonParallelizable]
              public class FunctionReferenceCompatibilityExampleTests
              {
                  [Test]
                  public void BetaDistributionExampleAvoidsTheDemonstratedNameCollision()
                  {
                      GSLInitializer.Initialize();
                      var evaluator = new ExpressionsEvaluator();
                      NUnit.Framework.Assert.Throws<CompilationException>(() => evaluator.Evaluate("Beta.PDF(2,2,0.5)", "", CalculationsMode.Real));
                      var function = evaluator.Evaluate("MathNet.Numerics.Distributions.Beta.PDF(2,2,0.5)", "", CalculationsMode.Real);
                      var value = Convert.ToDouble(function.Evaluate(0.0));
                      NUnit.Framework.Assert.That(value, Is.EqualTo(1.5).Within(1e-12));
                      var entries = new FunctionsDetailsFileSource().Details;
                      foreach (var entry in entries)
                          if (entry.Key.StartsWith("Beta.", StringComparison.Ordinal))
                          {
                              NUnit.Framework.Assert.That(entry.Value.Description, Does.Contain("collides"));
                              NUnit.Framework.Assert.That(entry.Value.Description, Does.Contain("MathNet.Numerics.Distributions.Beta.PDF"));
                          }
                  }

                  [Test]
                  public void BohachevskyReferenceSeparatesStandardDefinitionFromPinnedImplementation()
                  {
                      var standardAtOrigin = -0.3 * Math.Cos(0) - 0.4 * Math.Cos(0) + 0.7;
                      NUnit.Framework.Assert.That(standardAtOrigin, Is.EqualTo(0).Within(1e-12));
                      var actual = SpecialFunctions.Bohachevsky1(0, 0);
                      NUnit.Framework.Assert.That(actual, Is.EqualTo(-0.7).Within(1e-12));
                      NUnit.Framework.Assert.That(actual + 0.7, Is.EqualTo(standardAtOrigin).Within(1e-12));
                      var article = new FunctionsDetailsFileSource().Details["Bohachevsky1(x,y)"].Description;
                      NUnit.Framework.Assert.That(article, Does.Contain("omits"));
                      NUnit.Framework.Assert.That(article, Does.Contain("Bohachevsky1(0,0)+0.7"));
                      NUnit.Framework.Assert.That(article, Does.Contain("-0.7"));
                  }
              }
          }
          ''', encoding='utf-8', newline='\n')
          changed.append(str(test))
          subprocess.run(['git','add','--',*changed],check=True)
      - name: Regenerate the existing reference through Cake
        shell: pwsh
        run: ./build.ps1 -Target Reference-Generate
      - name: Commit example corrections with their regenerated XML
        shell: pwsh
        run: |
          git add -- Computator.NET.Core/Static/functions.xml Computator.NET.Core/Static/reference-equations
          git diff --cached --check
          if ($LASTEXITCODE -ne 0) { throw 'Whitespace check failed' }
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Document Beta naming collision and Bohachevsky normalization with tested examples'
          if ($LASTEXITCODE -ne 0) { throw 'Commit failed' }
          git push origin HEAD:fix/reference-reading-layout
          if ($LASTEXITCODE -ne 0) { throw 'Branch advanced; no force push attempted' }
      - name: Execute all reference examples and validate exact regeneration
        shell: pwsh
        run: ./build.ps1 -Target Reference-Validate
      - name: Exercise actual Windows reference controls
        shell: pwsh
        run: ./build.ps1 -Target DesktopTests
      - name: Exercise both web editors and packaged equation assets
        shell: pwsh
        run: ./build.ps1 -Target Web-Validate
      - name: Preserve reference and actual-control evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: reference-example-acceptance
          path: |
            artifacts/reference/**
            TestResults/**
            artifacts/*.binlog
            Computator.NET.WebClient/test-results/**
          retention-days: 7
