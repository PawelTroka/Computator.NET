name: Release identity and candidate evidence
on:
  pull_request:
  push:
    branches: [master]
permissions:
  contents: read
jobs:
  candidate:
    runs-on: windows-2025
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68
        with:
          global-json-file: global.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version-file: .nvmrc
      - name: Cake verifies unsigned candidate and commit-bound evidence
        shell: pwsh
        run: ./build.ps1 -Target Release-Verify
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: release-candidate-evidence
          path: |
            artifacts/release-evidence/**
            artifacts/reference/**
            artifacts/*.binlog
            artifacts/api/*.log
            TestResults/*.trx
            TestResults/desktop-smoke/**
            TestResults/packaged-gsl/**
            Computator.NET.WebClient/test-results/**
            Computator.NET.WebClient/playwright-report/**
          retention-days: 14
