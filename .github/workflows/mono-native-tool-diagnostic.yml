name: Diagnostic native Mono subprocess streams
on:
  workflow_dispatch:
  push:
    branches: [feature/mono-native-tool-diagnostic]
permissions:
  contents: read
  actions: read
concurrency:
  group: mono-native-tool-diagnostic-${{ github.sha }}
  cancel-in-progress: false
jobs:
  paired-arm64-streams:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Download the existing unaccepted master artifact on the Mac only
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: mono-macos-arm64
          run-id: 41546422037
          github-token: ${{ github.token }}
          path: artifacts/native-tool-discriminator/input
          digest-mismatch: error
      - name: Prepare only the native Mono runtime and external BCL driver
        run: |
          test "$(uname -m)" = arm64
          brew list --versions mono >/dev/null 2>&1 || brew install mono
          prefix=$(brew --prefix mono)
          mkdir -p artifacts/native-tool-discriminator/evidence
          mkdir -p artifacts/macos/package/Release/acceptance-osx-arm64-20261102T234145Z-21787/harness
          "$prefix/bin/mcs" -nologo -out:artifacts/macos/package/Release/acceptance-osx-arm64-20261102T234145Z-21787/harness/NativeToolProcessTests.exe \
            build/mono/NativeToolProcess.cs build/mono/NativeToolProcessTests.cs
      - name: Collect all paired exits and complete streams under unchanged assertions
        run: |
          python3 - <<'PY'
          import hashlib,json,os,pathlib,platform,subprocess,time
          root=pathlib.Path('artifacts/native-tool-discriminator').resolve()
          evidence=root/'evidence'
          original_layout=pathlib.Path('artifacts/macos/package/Release/acceptance-osx-arm64-20261102T234145Z-21787').resolve()
          archive=root/'input/package/Release/Computator.NET-mono-osx-arm64.zip'
          expected='76b22db6823132db4e65423f395ee9fbc42c40bcd5ff1d1602f83e7014515f46'
          digest=hashlib.sha256()
          with archive.open('rb') as stream:
              for block in iter(lambda:stream.read(1024*1024),b''):digest.update(block)
          if digest.hexdigest()!=expected:raise SystemExit('The failed master package ZIP differs from the pinned diagnostic input.')
          helper=pathlib.Path('build/mono/NativeToolProcess.cs').read_bytes()
          expected_helper='7987b0c0912cb53d494794d9182437bfa0369671f7dd80ea58dd968eb4d84fd3'
          if hashlib.sha256(helper).hexdigest()!=expected_helper:raise SystemExit('The subprocess implementation must remain identical to the pinned master source in this discriminator.')
          subprocess.run(['python3','build/macos/package.py','--extract',str(archive),'--output',str(original_layout/'relocated folder with spaces')],check=True)
          bundle=original_layout/'relocated folder with spaces/Computator.NET.app'
          resources=bundle/'Contents/Resources'
          manifest=json.loads((resources/'mono-package.json').read_text())
          if manifest['source']['commit']!='e40dcdb330befa7024f9f2656402c64a6287c2a8' or manifest['source']['tree']!='51c8d912c1eb9be363b484b791d046652ba2d92e' or manifest['source']['trackedChanges'] is not False:
              raise SystemExit('Unexpected failed-package source identity.')
          prefix=pathlib.Path(subprocess.check_output(['brew','--prefix','mono'],text=True).strip())
          mono=prefix/'bin/mono'
          environment=os.environ.copy()
          for name in ('COMPUTATOR_GITHUB_TOKEN','GITHUB_TOKEN','GH_TOKEN','COMPUTATOR_GSL_DIRECTORY','MONO_CFG_DIR','MONO_ENV_OPTIONS','MONO_GAC_PREFIX','MONO_PATH','DYLD_PRINT_LIBRARIES','DYLD_LIBRARY_PATH','DYLD_FALLBACK_LIBRARY_PATH','DYLD_FRAMEWORK_PATH','DYLD_FALLBACK_FRAMEWORK_PATH','DYLD_INSERT_LIBRARIES','MONO_WINFORMS_XIM_STYLE'):
              environment.pop(name,None)
          environment.update(MONO_MWF_MAC_FORCE_X11='1',COMPUTATOR_MONO_XIM_ACCEPTANCE='enabled',COMPUTATOR_NONINTERACTIVE='1',
              FONTCONFIG_FILE=str(resources/'native/fonts.conf'),FONTCONFIG_PATH=str(resources/'native'),GIO_MODULE_DIR=str(resources/'native/gio-modules'),
              GIO_EXTRA_MODULES='',XLOCALEDIR='/opt/X11/share/X11/locale',LIBTHAI_DICTDIR=str(resources/'native/libthai'),
              XDG_CONFIG_HOME=str(original_layout/'config'),XDG_CACHE_HOME=str(original_layout/'cache'))
          config=original_layout/'mono.config'
          with (evidence/'prepare.log').open('wb') as output:
              subprocess.run([str(mono),str(resources/'app/Computator.NET.Mono.Preflight.exe'),'prepare','--package-root',str(resources),'--config',str(config)],env=environment,stdout=output,stderr=subprocess.STDOUT,check=True,timeout=90)
          subprocess.run(['chmod','-R','a-w',str(bundle)],check=True)
          driver=original_layout/'harness/NativeToolProcessTests.exe'
          results=[]
          for ordinal in range(1,9):
              for label,path in (('original',str(resources/'app')+':'+str(resources/'app/Facades')),('existing-only',str(resources/'app'))):
                  directory=evidence/f'{ordinal:02d}-{label}';directory.mkdir()
                  child=environment.copy();child['MONO_PATH']=path
                  started=time.monotonic()
                  with (directory/'driver.stdout.log').open('wb') as output,(directory/'driver.stderr.log').open('wb') as error:
                      try:
                          process=subprocess.run([str(mono),'--config',str(config),str(driver),str(mono),str(directory)],env=child,stdout=output,stderr=error,timeout=15)
                          code=process.returncode
                      except subprocess.TimeoutExpired:code='external-timeout'
                  result={'ordinal':ordinal,'environment':label,'monoPath':path,'exitCode':code,'elapsedSeconds':round(time.monotonic()-started,3)}
                  results.append(result);print(json.dumps(result),flush=True)
          subprocess.run(['python3','build/macos/package.py','--verify','--output',str(bundle)],check=True)
          report={'scope':'paired native process-stream diagnosis only; no GUI or release acceptance','inputArtifactId':13188499979,'inputSource':manifest['source'],
              'inputArchiveSha256':expected,'inputArchiveSize':archive.stat().st_size,'inputPackageAccepted':False,
              'diagnosticCommit':subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip(),
              'nativeToolProcessSha256':hashlib.sha256(helper).hexdigest(),'instrumentedDriverSha256':hashlib.sha256(pathlib.Path('build/mono/NativeToolProcessTests.cs').read_bytes()).hexdigest(),
              'host':{'osVersion':subprocess.check_output(['sw_vers','-productVersion'],text=True).strip(),'osBuild':subprocess.check_output(['sw_vers','-buildVersion'],text=True).strip(),'machine':platform.machine()},
              'mono':str(mono),'monoVersion':subprocess.check_output([str(mono),'--version'],text=True).splitlines()[0],
              'facadesDirectoryExists':(resources/'app/Facades').is_dir(),'attempts':results,'allAttemptsPassed':all(item['exitCode']==0 for item in results)}
          (evidence/'paired-streams.json').write_text(json.dumps(report,indent=2)+'\n')
          if not report['allAttemptsPassed']:raise SystemExit('At least one unchanged native process contract failed; all paired evidence is retained.')
          PY
      - name: Retain only bounded diagnostic reports and streams
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: mono-native-tool-paired-arm64
          path: artifacts/native-tool-discriminator/evidence/**
          retention-days: 7
