version: '{build}'
image: Visual Studio 2026
configuration:
  - Debug
  - Release
clone_depth: 100
skip_tags: true

# Infrastructure only. The repository's Cake graph defines the build and test policy.
install:
  - ps: |
      $ErrorActionPreference = 'Stop'
      # The image also provides Python 2.7 on PATH. Select its installed x64
      # Python 3 explicitly before the SDK bootstrap or any Cake native task.
      $pythonDirectory = 'C:\Python314-x64'
      if (!(Test-Path -LiteralPath (Join-Path $pythonDirectory 'python.exe'))) { throw 'The selected AppVeyor image must provide Python 3.14 x64.' }
      $env:PATH = "$pythonDirectory;$env:PATH"
      python -c "import sys; assert sys.version_info >= (3, 11), 'Python 3.11 or newer is required'"
      if ($LASTEXITCODE -ne 0) { throw 'Python does not satisfy the native/source-evidence tooling requirements.' }
      [xml]$identity = Get-Content Version.props -Raw
      $productVersion = $identity.Project.PropertyGroup.ComputatorBaseVersion
      $prerelease = $identity.Project.PropertyGroup.ComputatorPrerelease
      if ($prerelease) { $productVersion += "-$prerelease" }
      Update-AppveyorBuild -Version "$productVersion.build.$env:APPVEYOR_BUILD_NUMBER"
      $sdk = (Get-Content global.json -Raw | ConvertFrom-Json).sdk.version
      $env:DOTNET_ROOT = Join-Path $env:LOCALAPPDATA "Computator-CI\dotnet-$sdk"
      python build/ci/verified_sdk.py --destination "$env:DOTNET_ROOT"
      if ($LASTEXITCODE -ne 0) { throw 'Verified SDK bootstrap failed.' }
      $env:PATH = "$env:DOTNET_ROOT;$env:PATH"
      Install-Product node (Get-Content .nvmrc -Raw).Trim() x64
      if ($LASTEXITCODE -ne 0) { throw 'Node installation failed.' }
      if (!(Get-Command pwsh -ErrorAction SilentlyContinue)) { throw 'The selected Windows image must include PowerShell 7.' }
      dotnet tool restore
      if ($LASTEXITCODE -ne 0) { throw 'Cake restoration failed.' }
      python build/ci/preflight.py --provider appveyor
      if ($LASTEXITCODE -ne 0) { throw 'The AppVeyor image does not match the repository toolchain.' }

build_script:
  - cmd: build.cmd -Target AppVeyor-Validate -Configuration %CONFIGURATION%

# Tests are Cake dependencies, never non-gating after_script commands.
test: off
artifacts:
  - path: publish\*.zip
  - path: TestResults\**\*.trx
  - path: Computator.NET.WebClient\test-results\**
  - path: artifacts\*.binlog
  - path: artifacts\ci\*.json
cache:
  - '%USERPROFILE%\.nuget\packages -> Directory.Packages.props'
  - '%LOCALAPPDATA%\npm-cache -> Computator.NET.WebClient\package-lock.json'
notifications:
  - provider: GitHubPullRequest
    on_build_success: true
    on_build_failure: true
    on_build_status_changed: true
# No deployment, signing keys, EULA acceptance or external coverage-upload credentials.
