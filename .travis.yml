# Travis validates the cross-platform web host, not unsupported Mono desktop builds.
language: node_js
os: linux
dist: noble
arch: amd64
node_js: '24'
before_install:
  - nvm install "$(cat .nvmrc)"
  - export DOTNET_ROOT="$HOME/.dotnet"
  - export PATH="$DOTNET_ROOT:$PATH"
  - curl --fail --location --silent --show-error https://dot.net/v1/dotnet-install.sh -o /tmp/computator-dotnet-install.sh
  - bash /tmp/computator-dotnet-install.sh --version "$(node -p 'require("./global.json").sdk.version')" --install-dir "$DOTNET_ROOT"
install: skip
script:
  - ./build.sh --target=Web-Validate
cache:
  directories:
    - $HOME/.nuget/packages
    - $HOME/.npm
# Browser failures are gating; tests must never run only in after_script.
